services:
  cardweb:
    build: .
    image: cardweb:latest
    container_name: cardweb
    restart: unless-stopped
    ports:
      - "8052:8052"
    environment:
      # 0 = 不自动轮询，全靠页面上的「立即抓取」手动触发全量抓取
      POLL_MINUTES: "0"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8052/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
